<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f1c" media="(prefers-color-scheme: dark)">
<title>Sin conexión · Unhooked</title>
<!--
  Página sin conexión de Unhooked. La guarda el service worker (public/sw.js) y se muestra cuando no hay internet.
  Todo va dentro de este archivo (estilos, íconos y textos) para que se vea bien aunque no haya nada más guardado.
  Idioma: cookie "lang" (la que usa el sitio) o el del navegador. Tema: el elegido en la tuerca o el del sistema.
-->
<style>
  :root { --bg:#ffffff; --card:#f5f7fb; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --brand:#2563eb; --tip:#eff6ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0a0f1c; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2937; --brand:#3b82f6; --tip:#0f1e3d; } }
  :root[data-theme="dark"] { --bg:#0a0f1c; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2937; --brand:#3b82f6; --tip:#0f1e3d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; display:grid; place-items:center; padding:24px 16px; }
  main { width:100%; max-width:440px; text-align:center; }
  .brand { display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:18px; }
  .brand svg { width:26px; height:26px; flex:none; }
  .icon { margin:40px auto 0; width:64px; height:64px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); }
  .icon svg { width:30px; height:30px; }
  h1 { margin:20px 0 0; font-size:28px; line-height:1.2; letter-spacing:-0.01em; }
  p { margin:12px 0 0; color:var(--muted); }
  .tip { margin-top:20px; padding:16px; border-radius:16px; background:var(--tip); color:var(--text); text-align:left; }
  .tip strong { display:block; margin-bottom:4px; color:var(--brand); font-size:13px; text-transform:uppercase; letter-spacing:0.08em; }
  button { margin-top:28px; height:48px; padding:0 28px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; }
  button:active { transform:scale(0.97); }
</style>
<script>
  // Tema elegido en la tuerca (mismo dato que usa el sitio)
  try { var p = localStorage.getItem("ciberlearn-theme"); if (p === "dark" || p === "light") document.documentElement.dataset.theme = p; } catch (e) {}
</script>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.75 19.25 5.5v5.75c0 4.6-3 8.3-7.25 9.99C7.75 19.55 4.75 15.85 4.75 11.25V5.5Z" fill="#2563eb"/><path d="m8.75 12.25 2.25 2.25 4.5-4.75" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Unhooked
  </div>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.01-1.52"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
  </div>
  <h1 data-es="Estás sin conexión" data-en="You're offline">Estás sin conexión</h1>
  <p data-es="Revisa tu internet y vuelve a intentarlo." data-en="Check your internet and try again.">Revisa tu internet y vuelve a intentarlo.</p>
  <div class="tip">
    <strong data-es="Mientras tanto, un consejo" data-en="Meanwhile, a tip">Mientras tanto, un consejo</strong>
    <span data-es="Si un mensaje te apura, te pide claves o códigos, o te ofrece algo demasiado bueno, detente: así empiezan casi todas las estafas." data-en="If a message rushes you, asks for passwords or codes, or offers something too good to be true, stop: that's how almost every scam starts.">Si un mensaje te apura, te pide claves o códigos, o te ofrece algo demasiado bueno, detente: así empiezan casi todas las estafas.</span>
  </div>
  <button type="button" onclick="location.reload()" data-es="Reintentar" data-en="Try again">Reintentar</button>
</main>
<script>
  // Idioma: el de la ruta (/en/...), la cookie del sitio o el del navegador
  (function () {
    var m = document.cookie.match(/(?:^|; )lang=(es|en)/);
    var lang = /^\/en(\/|$)/.test(location.pathname) ? "en" : /^\/es(\/|$)/.test(location.pathname) ? "es" : m ? m[1] : /^es/i.test(navigator.language || "") ? "es" : "en";
    document.documentElement.lang = lang;
    if (lang === "en") document.title = "Offline · Unhooked";
    document.querySelectorAll("[data-" + lang + "]").forEach(function (el) { el.textContent = el.getAttribute("data-" + lang); });
  })();
  // Vuelve sola cuando regresa el internet
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
